[package]
name = "npcs-treasury"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["NUNDINA"]
description = "NPCS treasury: USDC deposit -> 1:1 mint, the only mint path; supply == vault USDC enforced on every mint and burn (I1, doc 09 §3; SRS 08 §3.1 backup mode). #148."

[lib]
crate-type = ["cdylib", "lib"]
name = "npcs_treasury"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Exact pins: SRS locks anchor 1.1.x (see credit-gate/Cargo.toml).
anchor-lang = { version = "=1.1.2" }
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "token_2022"] }

[dev-dependencies]
