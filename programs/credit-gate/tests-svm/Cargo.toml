# LiteSVM integration tests for credit-gate.
#
# Deliberately its OWN workspace (not a member of the root Cargo.toml):
# litesvm pulls a large solana runtime tree, and sharing a lockfile with the
# program would let it bump crates the SBF build depends on. Mirrors
# payment-rails/tests-svm. Run after `anchor build` at the repo root:
#   cargo test --manifest-path programs/credit-gate/tests-svm/Cargo.toml
[package]
name = "credit-gate-svm-tests"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]

[dev-dependencies]
credit-gate = { path = "..", features = ["no-entrypoint"] }
anchor-lang = { version = "=1.1.2" }
litesvm = "0.16"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-instruction-error = "2"
solana-transaction-error = "3"
base64 = "0.22"
