# LiteSVM integration tests for payment-rails (R1+).
#
# Deliberately its OWN workspace (excluded from ../Cargo.toml): litesvm pulls
# a large solana runtime tree, and sharing a lockfile with the program would
# let it bump crates the SBF build depends on. Run after `anchor build`:
#   cargo test --manifest-path tests-svm/Cargo.toml
[package]
name = "payment-rails-svm-tests"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]

[dev-dependencies]
payment-rails = { path = "../programs/payment-rails", features = ["no-entrypoint"] }
# The gate every fill CPIs (#133): its account types and instruction builders.
credit-gate = { path = "../../programs/credit-gate", features = ["no-entrypoint"] }
# The engines that drive the rails (#136–#140), loaded from the root
# workspace's `anchor build` like credit-gate.
mark-engine = { path = "../../programs/mark-engine", features = ["no-entrypoint"] }
auction-engine = { path = "../../programs/auction-engine", features = ["no-entrypoint"] }
liquidity-facility = { path = "../../programs/liquidity-facility", features = ["no-entrypoint"] }
queue-claim = { path = "../../programs/queue-claim", features = ["no-entrypoint"] }
tranche-engine = { path = "../../programs/tranche-engine", features = ["no-entrypoint"] }
# The I1 mint-on-deposit treasury (#148), from the root workspace build.
npcs-treasury = { path = "../../programs/npcs-treasury", features = ["no-entrypoint"] }
# Read-only: the H1 ceiling the facility tests bound advances by (#94).
credit-math = { path = "../../programs/credit-math" }
anchor-lang = { version = "=1.1.2" }
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "token_2022", "token_2022_extensions"] }
litesvm = "0.16"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-account = "4"
solana-program-pack = "3"
solana-instruction-error = "3"
solana-transaction-error = "3"
# Decoding events from logs (#133).
base64 = "0.22"
