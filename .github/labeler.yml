docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

research:
  - changed-files:
      - any-glob-to-any-file: "preresearch/research/**"

architecture:
  - changed-files:
      - any-glob-to-any-file: "preresearch/architecture/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

legal:
  - changed-files:
      - any-glob-to-any-file: "preresearch/architecture/07-*"

onchain:
  - changed-files:
      - any-glob-to-any-file:
          - "programs/**"
          - "Anchor.toml"
          - "payment-rails/programs/**"
          - "payment-rails/tests-svm/**"
          - "payment-rails/Anchor.toml"
          - "payment-rails/Cargo.*"
          - "payment-rails/crank/idl/**"
          - "payment-rails/crank/src/**"
          - "payment-rails/crank/tests/**"
          - "payment-rails/crank/scripts/**"
          - "Cargo.toml"
          - "Cargo.lock"
          - "token/**"

web:
  - changed-files:
      - any-glob-to-any-file:
          - "client/**"
          - "web/**"
