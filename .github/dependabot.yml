version: 2
updates:
  # Keep CI actions pinned and current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
      - "dependencies"
    open-pull-requests-limit: 5

  # P0 scaffold: app/ landed (doc 08 §12)
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    labels:
      - "web"
      - "dependencies"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"

  # P0: Cargo workspace landed (workspace root is repo root, not /programs —
  # Dependabot reads the workspace manifest for member updates)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "onchain"
      - "dependencies"
    open-pull-requests-limit: 5
    # anchor-lang/anchor-spl are exact-pinned (`=1.1.2`) in every manifest on
    # purpose: 1.2.x is a different solana-program generation, and even a
    # patch bump rewrites the pin and changes the audited SBF build. No
    # anchor-* update of any kind is automated. Bump it deliberately, by
    # hand, together with Anchor.toml [toolchain] and ANCHOR_VERSION in
    # ci.yml (the `pins` CI step checks that they agree).
    ignore:
      - dependency-name: "anchor-*"

  # payment-rails: its own Cargo workspace and a separate LiteSVM test
  # workspace, each with its own lockfile (payment-rails/README.md).
  # Same anchor-* rule as the root entry above.
  - package-ecosystem: "cargo"
    directory: "/payment-rails"
    schedule:
      interval: "weekly"
    labels:
      - "onchain"
      - "dependencies"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "anchor-*"

  - package-ecosystem: "cargo"
    directory: "/payment-rails/tests-svm"
    schedule:
      interval: "weekly"
    labels:
      - "onchain"
      - "dependencies"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "anchor-*"

  - package-ecosystem: "npm"
    directory: "/payment-rails/crank"
    schedule:
      interval: "weekly"
    labels:
      - "onchain"
      - "dependencies"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"

  - package-ecosystem: "npm"
    directory: "/token"
    schedule:
      interval: "weekly"
    labels:
      - "onchain"
      - "dependencies"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"

  # credit-gate's LiteSVM tests: their own [workspace] and lockfile, like
  # payment-rails/tests-svm above, so they need their own entry (#98).
  # Same anchor-* rule as the root entry.
  - package-ecosystem: "cargo"
    directory: "/programs/credit-gate/tests-svm"
    schedule:
      interval: "weekly"
    labels:
      - "onchain"
      - "dependencies"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "anchor-*"
