version: 2
updates:
  # Keep CI actions pinned and current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
      - "dependencies"
    open-pull-requests-limit: 5

  # P0 scaffold: app/ landed (doc 08 §12)
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    labels:
      - "web"
      - "dependencies"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"

  # P0: Cargo workspace landed (workspace root is repo root, not /programs —
  # Dependabot reads the workspace manifest for member updates)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "onchain"
      - "dependencies"
    open-pull-requests-limit: 5
