name: automation

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  stale:
    name: Close stale issues & PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 14
          stale-issue-message: >
            This issue has been marked stale after 30 days of inactivity.
            It will close in 14 days unless revived. If it still matters,
            comment with current status or link it to an SRS phase (P0–P8).
          stale-pr-message: >
            This PR has been marked stale after 30 days of inactivity.
            It will close in 14 days unless revived.
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,blocked-on-counsel,blocked-on-issuer"
          exempt-pr-labels: "pinned,blocked-on-counsel"
          exempt-all-milestones: true
          operations-per-run: 60

  label:
    name: Label PRs by path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
