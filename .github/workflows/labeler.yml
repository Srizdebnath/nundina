name: labeler

# Path labels on every PR (#98). It used to run from the weekly `automation`
# schedule, where actions/labeler has no pull request to label, so
# .github/labeler.yml never reached the PRs it was written for.
#
# `pull_request_target` gives the token write access to labels even for fork
# PRs. That is safe here only because this job never checks out or runs PR
# code: labeler reads the PR's changed-file list through the API, and the
# config comes from the base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label PRs by path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
