name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust — fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Anchor pins agree (Anchor.toml · Cargo.toml · Cargo.lock · ci.yml)
        run: bash .github/scripts/check-anchor-pins.sh
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace -- -D warnings
      - name: Tests (unit + property)
        run: cargo test --locked --workspace

  # LiteSVM tests run the real SBF build, so they need anchor + solana-cli.
  # Own workspace + lockfile (programs/credit-gate/tests-svm/Cargo.toml).
  credit-gate-svm:
    name: credit-gate — LiteSVM (against anchor build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLANA_VERSION: 2.3.0
      ANCHOR_VERSION: 1.1.2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            programs/credit-gate/tests-svm -> target
      - name: Install solana-cli ${{ env.SOLANA_VERSION }} + anchor ${{ env.ANCHOR_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: anchor build
        run: anchor build
      - name: Format + clippy (test crate)
        working-directory: programs/credit-gate/tests-svm
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (LiteSVM)
        run: cargo test --locked --manifest-path programs/credit-gate/tests-svm/Cargo.toml

  app:
    name: app — typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

  # payment-rails is its own Cargo/Anchor workspace (payment-rails/README.md
  # § Layout), so the root `rust` job never sees it. Everything runs from
  # inside the folder against its own lockfiles.
  payment-rails:
    name: payment-rails — fmt · clippy · test · LiteSVM · IDL drift · drill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOLANA_VERSION: 2.3.0
      ANCHOR_VERSION: 1.1.2
    defaults:
      run:
        working-directory: payment-rails
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            payment-rails -> target
            payment-rails/tests-svm -> target
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests (unit)
        run: cargo test --locked --workspace
      # tests-svm is its own workspace (own lockfile), so the steps above
      # never see it. Same gate as the credit-gate-svm job.
      - name: Format + clippy (LiteSVM test crate)
        working-directory: payment-rails/tests-svm
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Install solana-cli ${{ env.SOLANA_VERSION }} + anchor ${{ env.ANCHOR_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: anchor build
        run: anchor build
      - name: Tests (LiteSVM, against the built .so)
        run: cargo test --locked --manifest-path tests-svm/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: payment-rails/crank/package-lock.json
      - name: crank — npm ci
        working-directory: payment-rails/crank
        run: npm ci
      # The committed IDL is what the crank decodes accounts and errors with.
      # A state.rs / error.rs change that isn't re-synced must fail here.
      - name: IDL drift (crank/idl vs anchor build)
        working-directory: payment-rails/crank
        run: |
          npm run sync-idl
          # --porcelain also catches a deleted-then-recreated (untracked)
          # file, which `git diff` alone ignores.
          test -z "$(git status --porcelain -- idl/)" \
            || { echo "::error::crank/idl/payment_rails.json is stale — run 'npm run sync-idl' after 'anchor build' and commit it"; exit 1; }
      - name: Kill-the-crank drill (local validator)
        working-directory: payment-rails/crank
        run: npm run drill

  payment-rails-crank:
    name: payment-rails/crank — typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: payment-rails/crank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: payment-rails/crank/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # token/ has no Rust; its scripts talk to a live mint. CI gates what can
  # run offline: typecheck, plus the manifest drift tests in token/tests.
  token:
    name: token — typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: token/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
