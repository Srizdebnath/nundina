name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repo (#98). Declared, so the token can't inherit a
# wider repo default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Supply chain (#98):
# - every `uses:` is pinned to a commit SHA (the tag it was taken from is in
#   the trailing comment; dependabot's github-actions entry bumps both);
# - the host Rust toolchain is pinned (rust-toolchain.toml; the `toolchain:`
#   inputs below must equal it, checked by check-anchor-pins.sh), so the fmt
#   and clippy gates can't turn red because "stable" moved;
# - solana-cli and anchor are downloaded and checked against pinned SHA-256s
#   (.github/scripts/install-solana-anchor.sh), never piped from a URL to sh.
#
# Every job name below is a required status check on `main` (#98). Renaming a
# job means updating the `main-protection` ruleset in the same change.
jobs:
  rust:
    name: rust — fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Pins agree (anchor everywhere · rust-toolchain.toml vs ci.yml)
        run: bash .github/scripts/check-anchor-pins.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace -- -D warnings
      - name: Tests (unit + property)
        run: cargo test --locked --workspace

  # SRS 08 §13 / D8: 100% branch coverage on credit-math, gated here
  # (branch coverage needs nightly). Both gates must be able to fail (#87):
  # - `shell: bash` runs the step as `bash -eo pipefail`, so `| tee` cannot
  #   swallow llvm-cov's exit status (the default `bash -e` has no pipefail);
  # - cargo-llvm-cov has no --fail-under-branches, so the branch gate reads
  #   the totals from its JSON report.
  # The nightly is a dated pin, like the stable toolchain (#98).
  credit-math-coverage:
    name: credit-math — coverage (lines + branches)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NIGHTLY: nightly-2026-09-30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Coverage (gate — 100% lines, 100% branches)
        shell: bash
        run: |
          cargo "+$NIGHTLY" llvm-cov --locked -p credit-math --branch --summary-only \
            --fail-under-lines 100 | tee coverage.txt
          cargo "+$NIGHTLY" llvm-cov report -p credit-math --branch --json --summary-only > coverage.json
          jq -e '.data[0].totals.branches | .count > 0 and .notcovered == 0' coverage.json > /dev/null \
            || { echo "::error::credit-math branch coverage is below 100% (SRS 08 §13 / D8)"; jq '.data[0].totals.branches' coverage.json; exit 1; }
      - name: Publish coverage
        if: always()
        shell: bash
        run: |
          [ -f coverage.txt ] || exit 0
          { echo '### credit-math coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # LiteSVM tests run the real SBF build, so they need anchor + solana-cli.
  # Own workspace + lockfile (programs/credit-gate/tests-svm/Cargo.toml).
  credit-gate-svm:
    name: credit-gate — LiteSVM (against anchor build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLANA_VERSION: 2.3.0
      ANCHOR_VERSION: 1.1.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            programs/credit-gate/tests-svm -> target
      - name: Install solana-cli ${{ env.SOLANA_VERSION }} + anchor ${{ env.ANCHOR_VERSION }} (SHA-256 verified)
        run: bash .github/scripts/install-solana-anchor.sh
      - name: anchor build
        run: anchor build
      # cargo-build-sbf has no --locked/--frozen, so the SBF build — the
      # binary that ships — could silently re-resolve the lockfile (#98).
      - name: Lockfiles unchanged by anchor build
        run: |
          git diff --exit-code -- '**/Cargo.lock' 'Cargo.lock' \
            || { echo "::error::anchor build changed a Cargo.lock — the SBF build re-resolved dependencies"; exit 1; }
      - name: Format + clippy (test crate)
        working-directory: programs/credit-gate/tests-svm
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      # build.rs builds the program from source into its OUT_DIR (#169), so
      # no stale target/deploy .so can be what the tests load.
      - name: Tests (LiteSVM)
        run: cargo test --locked --manifest-path programs/credit-gate/tests-svm/Cargo.toml
      - name: Tested .so == anchor build .so
        run: |
          want=$(sha256sum target/deploy/credit_gate.so | cut -d' ' -f1)
          found=0
          for so in $(find programs/credit-gate/tests-svm/target -path '*/out/credit_gate.so'); do
            found=1
            got=$(sha256sum "$so" | cut -d' ' -f1)
            echo "$so $got (anchor build: $want)"
            [ "$got" = "$want" ] || { echo "::error::the LiteSVM suite ran a different credit_gate.so than anchor build produced"; exit 1; }
          done
          [ "$found" = 1 ] || { echo "::error::no build.rs credit_gate.so found"; exit 1; }

  client:
    name: client — lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Decoders against real devnet account bytes; tx builders (#144).
      - run: npm test
      - run: npm run build

  services:
    name: services — typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Indexer on real transactions in PGlite (real Postgres), API, NAV math vs credit-math (#141).
      - run: npm test

  # payment-rails is its own Cargo/Anchor workspace (payment-rails/README.md
  # § Layout), so the root `rust` job never sees it. Everything runs from
  # inside the folder against its own lockfiles.
  payment-rails:
    name: payment-rails — fmt · clippy · test · LiteSVM · IDL drift · drill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOLANA_VERSION: 2.3.0
      ANCHOR_VERSION: 1.1.2
    defaults:
      run:
        working-directory: payment-rails
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            payment-rails -> target
            payment-rails/tests-svm -> target
            . -> target
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests (unit)
        run: cargo test --locked --workspace
      # tests-svm is its own workspace (own lockfile), so the steps above
      # never see it. Same gate as the credit-gate-svm job.
      - name: Format + clippy (LiteSVM test crate)
        working-directory: payment-rails/tests-svm
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
      # Fuzz invariants (#125), seeded smoke on stable: the same check_*
      # functions the libFuzzer targets run (job `fuzz` below). Own
      # workspace + lockfile, like tests-svm.
      - name: Fuzz invariants — fmt · clippy · seeded smoke (stable)
        working-directory: payment-rails/fuzz
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --release
      - name: Install solana-cli ${{ env.SOLANA_VERSION }} + anchor ${{ env.ANCHOR_VERSION }} (SHA-256 verified)
        working-directory: .
        run: bash .github/scripts/install-solana-anchor.sh
      - name: anchor build
        run: anchor build
      # Every fill CPIs credit-gate (#133): the LiteSVM suite and the drill
      # load the root workspace's credit_gate.so next to payment_rails.so.
      - name: anchor build (root workspace — credit-gate)
        working-directory: .
        run: anchor build
      # cargo-build-sbf has no --locked/--frozen (#98); see credit-gate-svm.
      - name: Lockfiles unchanged by anchor build
        working-directory: .
        run: |
          git diff --exit-code -- '**/Cargo.lock' \
            || { echo "::error::anchor build changed a Cargo.lock — the SBF build re-resolved dependencies"; exit 1; }
      - name: Tests (LiteSVM, against the built .so)
        run: cargo test --locked --manifest-path tests-svm/Cargo.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: payment-rails/crank/package-lock.json
      - name: crank — npm ci
        working-directory: payment-rails/crank
        run: npm ci
      # The committed IDL is what the crank decodes accounts and errors with.
      # A state.rs / error.rs change that isn't re-synced must fail here.
      - name: IDL drift (crank/idl vs anchor build)
        working-directory: payment-rails/crank
        run: |
          npm run sync-idl
          # --porcelain also catches a deleted-then-recreated (untracked)
          # file, which `git diff` alone ignores.
          test -z "$(git status --porcelain -- idl/)" \
            || { echo "::error::crank/idl/payment_rails.json is stale — run 'npm run sync-idl' after 'anchor build' and commit it"; git diff -- idl/ | head -200; exit 1; }
      - name: Kill-the-crank drill (local validator)
        working-directory: payment-rails/crank
        run: npm run drill

  # SRS 08 §11 (#125): fuzz targets for the escrow / settle / waterfall /
  # refund / facility math ship with the code. libFuzzer needs nightly; the
  # nightly is the same dated pin as the coverage job. Each target runs for
  # a fixed budget; a crash fails the job and its reproducer is uploaded.
  # The stable smoke of the same invariants runs in `payment-rails`.
  fuzz:
    name: payment-rails — fuzz (libFuzzer, 60s/target)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NIGHTLY: nightly-2026-09-30
    defaults:
      run:
        working-directory: payment-rails/fuzz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.NIGHTLY }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: payment-rails/fuzz -> target
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-fuzz@0.13.2
      # The prebuilt cargo-fuzz is a musl binary and defaults --target to its
      # own triple, where ASan cannot link (static libc). Build for glibc.
      # Build first, so a build error isn't reported as a fuzz finding.
      - name: Build every target
        run: cargo "+$NIGHTLY" fuzz build --target x86_64-unknown-linux-gnu
      - name: Fuzz every target
        shell: bash
        run: |
          for t in $(cargo "+$NIGHTLY" fuzz list); do
            echo "::group::$t"
            cargo "+$NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=60 \
              || { echo "::error::fuzz target $t found a failing input (reproducer in the fuzz-artifacts upload)"; exit 1; }
            echo "::endgroup::"
          done
      # cargo-fuzz has no --locked; a re-resolved lockfile fails here instead.
      - name: Lockfile unchanged by cargo fuzz
        run: git diff --exit-code -- Cargo.lock
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: payment-rails/fuzz/artifacts/
          if-no-files-found: ignore

  payment-rails-crank:
    name: payment-rails/crank — typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: payment-rails/crank
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: payment-rails/crank/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # ops/gate (#122): SAS + Token ACL onboarding tools. They talk to a live
  # cluster and their end-to-end test clones Token ACL and SAS from devnet,
  # so CI gates the typecheck. Not in the main-protection ruleset yet.
  gate-ops:
    name: ops/gate — typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ops/gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ops/gate/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # ops/squads (#126): the migration tool talks to a live cluster and its
  # end-to-end test clones Squads v4 from devnet, so CI gates what runs
  # offline: the typecheck. Not in the main-protection ruleset yet.
  squads:
    name: ops/squads — typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ops/squads
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ops/squads/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # token/ has no Rust; its scripts talk to a live mint. CI gates what can
  # run offline: typecheck, plus the manifest drift tests in token/tests.
  token:
    name: token — typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: token/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
