# NUNDINA — Anchor workspace configuration
# Toolchain: anchor 1.1.2 (avm) · solana-cli 2.3.0 · SRS 08 §12 P0

[features]
resolution = true
skip-lint = false

# Anchor must treat ONLY this member as a program — credit-math is a plain
# dependency crate (no #[program]), and anchor's IDL pass would otherwise
# try to extract an IDL from it and fail.
[workspace]
members = ["programs/credit-gate", "programs/mark-engine", "programs/auction-engine"]

[programs.localnet]
credit-gate = "5ycYLKQjrbwxQ6VQLUSkQZXwLMn1zEeJ6f5ogFYzX6XX"
mark-engine = "79ypVjMMCDbmxYWaXTTgxz9jidjncoJAhHQC6e13x4LH"
auction-engine = "Cw6wNpVJUaofUDZewG8sDKZu3nnHga4GaJJvKn7rSod7"

[programs.devnet]
credit-gate = "5ycYLKQjrbwxQ6VQLUSkQZXwLMn1zEeJ6f5ogFYzX6XX"
mark-engine = "79ypVjMMCDbmxYWaXTTgxz9jidjncoJAhHQC6e13x4LH"
auction-engine = "Cw6wNpVJUaofUDZewG8sDKZu3nnHga4GaJJvKn7rSod7"

[programs.mainnet]
credit-gate = "5ycYLKQjrbwxQ6VQLUSkQZXwLMn1zEeJ6f5ogFYzX6XX"
mark-engine = "79ypVjMMCDbmxYWaXTTgxz9jidjncoJAhHQC6e13x4LH"
auction-engine = "Cw6wNpVJUaofUDZewG8sDKZu3nnHga4GaJJvKn7rSod7"

[registry]
url = "https://api.apr.dev"

[provider]
# P1 deploys target devnet (08 §9): localnet for tests → devnet for AC-1.
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# Scripts live under token/scripts (doc 09 §9) once P1 begins.
[test]
startup_wait = 10_000
shutdown_wait = 2_000

# [scripts] block deferred to P1: the pilot's test harness is the TS E2E
# suite (SRS §13) driven from token + tests/, not anchor's default
# ts-mocha layout. Anchor 1.1 parses an empty scripts key as `""`, which
# fails; the block returns when the P1 harness lands.

[toolchain]
# Anchor 1.1.x → SBF toolchain; overflow-checks enforced in workspace profile.
anchor_version = "1.1.2"
solana_version = "2.3.0"
